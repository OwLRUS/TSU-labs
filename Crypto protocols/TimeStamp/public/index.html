<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeStamp Service</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .form-container {
            display: none;
        }
        .form-container.active {
            display: block;
        }
        a {
            display: inline-block;
            margin: 10px 0;
            color: blue;
            text-decoration: underline;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>TimeStamp Service</h1>

    <nav>
        <a id="link-register">Получить метку времени</a> |
        <a id="link-login">Проверить метку времени</a>
    </nav>

    <div id="register-container" class="form-container">
        <h2>Получить МВ</h2>
        <form id="register-form">
            <input type="text" id="register-username" placeholder="Ваше ФИО" required><br>
            <input type="text" id="register-email" placeholder="Ваша электронная почта" required><br>
            <input type="file" id="r_file" placeholder="upload" required><br>
            <button type="submit">Отправить</button>
        </form>
    </div>

    <div id="login-container" class="form-container">
        <h2>Проверить МВ</h2>
        <form id="login-form">
            <input type="file" id="l_file" placeholder="upload" required><br>
            <input type="text" id="iter" placeholder="Глубина проверки" required><br>
            <button type="submit">Проверить</button>
        </form>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

    <script>
        const registerForm = document.getElementById('register-form');
        const loginForm = document.getElementById('login-form');

        const registerContainer = document.getElementById('register-container');
        const loginContainer = document.getElementById('login-container');

        const linkRegister = document.getElementById('link-register');
        const linkLogin = document.getElementById('link-login');

        // Навигация между формами
        linkRegister.addEventListener('click', () => {
            registerContainer.classList.add('active');
            loginContainer.classList.remove('active');
        });

        linkLogin.addEventListener('click', () => {
            loginContainer.classList.add('active');
            registerContainer.classList.remove('active');
        });

        // Показываем по умолчанию форму получения МВ
        registerContainer.classList.add('active');

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('register-username').value;
            const email = document.getElementById('register-email').value;
            const file = document.getElementById('r_file').value;
        
            try {
                const seedResponse = await fetch('http://localhost:3000/seed', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({}),
                });

                const seedJson = await seedResponse.json();
                const seed = seedJson.seed;
                
                const hashedFile = CryptoJS.HmacSHA256(file, seed).toString(CryptoJS.enc.Hex);
                const hashedName = CryptoJS.HmacSHA256(username, seed).toString(CryptoJS.enc.Hex);
                const hashedEmail = CryptoJS.HmacSHA256(email, seed).toString(CryptoJS.enc.Hex);
                
                const response = await fetch('http://localhost:3000/make', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username : hashedName, email : hashedEmail, file: hashedFile, seed }),
                });
        
                if (response.ok) {
                    alert('Метка времени установлена');
                    const result = await response.json();
                    
                    console.log('Полученные данные:', result);
                     // Преобразуем JSON в строку
                    const dataStr = JSON.stringify(result, null, 2);

                    // Создаём Blob-объект для текста
                    const blob = new Blob([dataStr], { type: 'application/json' });

                    // Создаём ссылку для скачивания файла
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = `Обращение_${result.n}.json`; // Задаём имя файла с расширением .txt
                    document.body.appendChild(link);
                    link.click();

                    // Очищаем ресурсы
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);
                } else {
                    const errorText = await response.text();
                    alert(`Ошибка постановки метки времени: ${errorText}`);
                }
            } catch (error) {
                alert('Ошибка системы');
            }
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('l_file');
            let iter = document.getElementById('iter').value;

            if(iter < 1){
                alert('Глубина проверки не может быть меньше 1! Установлено значение 1!');
                iter = 1;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();
        
            reader.onload = async () => {
                try {
                    // Читаем содержимое файла
                    const fileContent = reader.result;

                    // Формируем JSON для отправки
                    const payload = {
                        file: JSON.parse(fileContent), // Парсим содержимое файла
                        iter: parseInt(iter, 10), // Указываем итерацию как число
                    };

                    const response = await fetch('http://localhost:3000/check', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(payload),
                    });

                    if (response.ok) {
                        const result = await response.text();
                        alert(`Метка времени проверена: ${result}`);
                    } else {
                        const errorText = await response.text();
                        alert(`Ошибка проверки метки времени: ${errorText}`);
                    }
                } catch (error) {
                    console.error('Ошибка при обработке файла:', error);
                    alert('Некорректный формат файла или ошибка обработки!');
                }
            };

            // Обработка ошибок чтения файла
            reader.onerror = () => {
                console.error('Ошибка чтения файла:', reader.error);
                alert('Ошибка чтения файла!');
            };

            // Чтение файла в текстовом формате
            reader.readAsText(file);
        });
    </script>
</body>
</html>
